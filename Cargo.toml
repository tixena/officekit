[workspace]
members = ["crates/officekit", "crates/officekit-cli", "crates/officekit-markup", "crates/officekit-markup-base", "crates/officekit-markup-core", "crates/officekit-markup-ext", "crates/officekit-packaging", "crates/officekit-parts", "crates/officekit-strict", "crates/officekit-transitional", "crates/officekit-traversal", "crates/officekit-validation", "crates/officekit-xml", "crates/xtask"]
default-members = ["crates/officekit", "crates/officekit-cli", "crates/officekit-markup", "crates/officekit-markup-base", "crates/officekit-markup-core", "crates/officekit-markup-ext", "crates/officekit-packaging", "crates/officekit-parts", "crates/officekit-strict", "crates/officekit-transitional", "crates/officekit-traversal", "crates/officekit-validation", "crates/officekit-xml"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
authors = ["Eduardo Burgos <eduardo@tixena.com>"]
license = "MIT"
repository = "https://github.com/eburgos/officekit"

[workspace.dependencies]
# Every entry turns its default features off: each crate turns on the
# features it uses, and no more.
officekit = { path = "crates/officekit", default-features = false }
officekit-markup = { path = "crates/officekit-markup" }
officekit-markup-base = { path = "crates/officekit-markup-base" }
officekit-markup-core = { path = "crates/officekit-markup-core" }
officekit-markup-ext = { path = "crates/officekit-markup-ext" }
officekit-packaging = { path = "crates/officekit-packaging" }
officekit-parts = { path = "crates/officekit-parts", default-features = false }
officekit-strict = { path = "crates/officekit-strict" }
officekit-transitional = { path = "crates/officekit-transitional" }
officekit-traversal = { path = "crates/officekit-traversal" }
officekit-validation = { path = "crates/officekit-validation" }
officekit-xml = { path = "crates/officekit-xml" }

# CLI framework
clap = { version = "4", default-features = false }

# JSON output
serde_json = { version = "1.0", default-features = false }

# System abstraction (filesystem, env, temp dirs). The only route to the OS:
# no crate in this workspace calls std::fs or std::env directly.
os-shim = { version = "0.1.2", default-features = false }

# Markdown documents as a typed tree
arky = { git = "https://github.com/tixena/arky.git", default-features = false }

# Pictures in markdown: an SVG rendered to PNG, a WebP decoded to PNG
image-webp = { version = "0.2.4", default-features = false }
png = { version = "0.18.1", default-features = false }
resvg = { version = "0.48.1", default-features = false }

# Test-only: builds zip archives whose entries carry data descriptors, as
# files from streaming exporters do. Packages themselves go through os-shim's
# zip feature.
zip = { version = "9.0.4", default-features = false }

# Reads and writes the XML of every part (D29).
quick-xml = { version = "0.42", default-features = false }

# The typed tree archived, read in place without parsing.
rkyv = { version = "0.8", default-features = false }

# Error handling
anyhow = { version = "1", default-features = false }
thiserror = { version = "2", default-features = false }

# Regular expressions: the pattern facets of XML Schema, and folder names
regex = { version = "1", default-features = false }
regex-automata = { version = "0.4", default-features = false }
regex-syntax = { version = "0.8", default-features = false }
aho-corasick = { version = "1", default-features = false }
indexmap = { version = "2", default-features = false }
serde_core = { version = "1", default-features = false }
syn = { version = "3", default-features = false }
bstr = { version = "1", default-features = false }
flate2 = { version = "1", default-features = false }
libc = { version = "0.2", default-features = false }
log = { version = "0.4", default-features = false }
simd-adler32 = { version = "0.3", default-features = false }
zlib-rs = { version = "0.6", default-features = false }

# An image's pixel size, read from its header
imagesize = { version = "0.15", default-features = false }

# A document-protection password's hash and salt, written as text
sha1 = { version = "0.10", default-features = false }
base64 = { version = "0.22", default-features = false }

# The generator's hand-maintained tables, and the SHA-256 in the header of
# every generated file
toml = { version = "1", default-features = false }
sha2 = { version = "0.10", default-features = false }

# Test-only crates
assert_cmd = { version = "2", default-features = false }
tempfile = { version = "3", default-features = false }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

# The three markup crates keep file and line numbers only: their full debug info
# takes memory past the gate's cap.
[profile.dev.package.officekit-markup-base]
debug = "line-tables-only"

[profile.dev.package.officekit-markup-core]
debug = "line-tables-only"

[profile.dev.package.officekit-markup-ext]
debug = "line-tables-only"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
restriction = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
blanket_clippy_restriction_lints = "allow"
implicit_return = "allow"
pub_with_shorthand = "allow"
module_name_repetitions = "allow"
question_mark_used = "allow"
self_named_module_files = "allow"
separated_literal_suffix = "allow"
single_call_fn = "allow"
print_stderr = "allow"
# Parsers and byte-level container code index and do arithmetic on slices.
indexing_slicing = "allow"
arithmetic_side_effects = "allow"
string_slice = "allow"
# Write to String is infallible; discarding the result is intentional.
let_underscore_must_use = "allow"
# Private implementation details do not need doc comments on every field.
missing_docs_in_private_items = "allow"
# Inline annotations are a micro-optimization applied selectively, not globally.
missing_inline_in_public_items = "allow"
# as_conversions are used sparingly and safely for numeric casts.
as_conversions = "allow"
# Tests use unwrap() for concise assertions.
unwrap_used = "allow"
# Pattern matching through references is idiomatic in filter_map closures.
pattern_type_mismatch = "allow"
# Single-char identifiers are fine in tight scopes (loop vars, closures).
min_ident_chars = "allow"
# Test function naming is clearer with descriptive names, not enforced prefix rules.
redundant_test_prefix = "allow"
# Integer division is used safely for threshold calculations and tests.
integer_division = "allow"
integer_division_remainder_used = "allow"
# HashSet iteration order is irrelevant for set-comparison operations.
iter_over_hash_type = "allow"
# HashSet parameters use the default hasher; generalization adds complexity for no benefit.
implicit_hasher = "allow"
# Hook traits give every hook a default, so a context implements only the
# hooks it needs (D12).
missing_trait_methods = "allow"
# The facade officekit-markup and ext's hook modules re-export the typed tree, so callers keep
# the officekit_markup::<namespace> paths (the owner's decision: officekit is a library and must
# stay easy to use).
pub_use = "allow"
