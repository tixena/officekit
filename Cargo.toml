[workspace]
members = ["crates/officekit", "crates/officekit-core", "crates/officekit-packaging", "crates/officekit-validation", "crates/officekit-xml", "crates/xtask"]
default-members = ["crates/officekit", "crates/officekit-core", "crates/officekit-packaging", "crates/officekit-validation", "crates/officekit-xml"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
authors = ["Eduardo Burgos <eduardo@tixena.com>"]
license = "MIT"
repository = "https://github.com/eburgos/officekit"

[workspace.dependencies]
officekit-core = { path = "crates/officekit-core" }
officekit-packaging = { path = "crates/officekit-packaging" }
officekit-validation = { path = "crates/officekit-validation" }
officekit-xml = { path = "crates/officekit-xml" }

# CLI framework
clap = { version = "4", features = ["derive", "env"] }

# JSON output
serde_json = "1.0"

# System abstraction (filesystem, env, temp dirs). The only route to the OS:
# no crate in this workspace calls std::fs or std::env directly.
os-shim = { git = "https://github.com/tixena/os-shim.git" }

# Test-only: builds zip archives whose entries carry data descriptors, as
# files from streaming exporters do. Packages themselves go through os-shim's
# zip feature. Feature selection matches os-shim's so both resolve to one
# build of the crate.
zip = { version = "9.0.4", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# Reads and writes the XML of every part (D29).
quick-xml = "0.42"

# Error handling
anyhow = "1"
thiserror = "2"

# Test-only crates
assert_cmd = "2"
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
restriction = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
blanket_clippy_restriction_lints = "allow"
implicit_return = "allow"
pub_with_shorthand = "allow"
module_name_repetitions = "allow"
question_mark_used = "allow"
self_named_module_files = "allow"
separated_literal_suffix = "allow"
single_call_fn = "allow"
print_stderr = "allow"
# Parsers and byte-level container code index and do arithmetic on slices.
indexing_slicing = "allow"
arithmetic_side_effects = "allow"
string_slice = "allow"
# Write to String is infallible; discarding the result is intentional.
let_underscore_must_use = "allow"
# Private implementation details do not need doc comments on every field.
missing_docs_in_private_items = "allow"
# Inline annotations are a micro-optimization applied selectively, not globally.
missing_inline_in_public_items = "allow"
# as_conversions are used sparingly and safely for numeric casts.
as_conversions = "allow"
# Tests use unwrap() for concise assertions.
unwrap_used = "allow"
# Pattern matching through references is idiomatic in filter_map closures.
pattern_type_mismatch = "allow"
# Single-char identifiers are fine in tight scopes (loop vars, closures).
min_ident_chars = "allow"
# Test function naming is clearer with descriptive names, not enforced prefix rules.
redundant_test_prefix = "allow"
# Integer division is used safely for threshold calculations and tests.
integer_division = "allow"
integer_division_remainder_used = "allow"
# HashSet iteration order is irrelevant for set-comparison operations.
iter_over_hash_type = "allow"
# HashSet parameters use the default hasher; generalization adds complexity for no benefit.
implicit_hasher = "allow"
# Hook traits give every hook a default, so a context implements only the
# hooks it needs (D12).
missing_trait_methods = "allow"
