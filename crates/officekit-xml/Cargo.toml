[package]
name = "officekit-xml"
description = "The XML layer of officekit: element tree, names, values, markup compatibility, part reader and writer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# rkyv and the archive of every type: officekit's binary form.
binary-format = ["dep:rkyv"]

[dependencies]
quick-xml.workspace = true
thiserror.workspace = true
regex = { workspace = true, features = ["unicode-perl"] }
rkyv = { workspace = true, optional = true, features = ["alloc", "bytecheck"] }
