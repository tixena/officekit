[package]
name = "officekit-xml"
description = "The XML and package layer of officekit: element tree, names, values, markup compatibility, part reader and writer, and the Open Packaging Conventions container with its part names, content types, relationships and image parts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
include = ["/src/**/*.rs", "/build.rs", "/LICENSE", "/LICENSE-OPEN-XML-SDK"]

[lints]
workspace = true

[features]
# rkyv and the archive of every type: officekit's binary form.
binary-format = ["dep:rkyv"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
quick-xml.workspace = true
thiserror = { workspace = true, features = ["default", "std"] }
regex = { workspace = true, features = ["std", "unicode-gencat", "unicode-perl"] }
rkyv = { workspace = true, optional = true, features = ["alloc", "bytecheck", "indexmap-2", "std"] }

# System abstraction (filesystem, env, temp dirs); its zip feature moves a
# package between an archive and an in-memory filesystem
os-shim = { workspace = true, features = ["zip"] }

# Reads an image's pixel size from its header; no pixel decoding
imagesize = { workspace = true, features = ["bmp", "default", "gif", "jpeg", "png", "tiff"] }

# The features other crates of the workspace turn on, asked for here so every
# cargo line resolves one set and the generated crates compile once.
aho-corasick = { workspace = true, features = ["default", "perf-literal", "std"] }
bstr = { workspace = true, features = ["alloc", "default", "std", "unicode"] }
flate2 = { workspace = true, features = ["any_impl", "any_zlib", "default", "miniz_oxide", "runtime_detection", "rust_backend", "zlib-rs"] }
indexmap = { workspace = true, features = ["default", "serde", "std"] }
libc = { workspace = true, features = ["default", "std"] }
log = { workspace = true, features = ["alloc", "std"] }
regex-automata = { workspace = true, features = ["alloc", "dfa-onepass", "dfa-search", "hybrid", "meta", "nfa", "nfa-backtrack", "nfa-pikevm", "nfa-thompson", "perf", "perf-inline", "perf-literal", "perf-literal-multisubstring", "perf-literal-substring", "std", "syntax", "unicode-gencat", "unicode-perl", "unicode-word-boundary"] }
regex-syntax = { workspace = true, features = ["std", "unicode-gencat", "unicode-perl"] }
serde_core = { workspace = true, features = ["alloc", "result", "std"] }
simd-adler32 = { workspace = true, features = ["const-generics", "default", "std"] }
zlib-rs = { workspace = true, features = ["rust-allocator", "std"] }

[build-dependencies]
# The features the CLI's proc-macros turn on, so the proc-macros' syn is the
# same in every cargo line.
syn = { workspace = true, features = ["clone-impls", "default", "derive", "extra-traits", "full", "parsing", "printing", "proc-macro"] }

[dev-dependencies]
# Tests build archives whose entries carry data descriptors
zip.workspace = true
