[package]
name = "officekit-markup-core"
description = "The namespaces of the typed tree that reference each other in a cycle"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# The crate's tests are integration tests; a unit-test or bench target would
# compile the whole crate a second time, beside the library, past the gate's
# memory cap.
test = false
doctest = false
bench = false

[lints]
workspace = true

[features]
# rkyv and the archive of every type: officekit's binary form.
binary-format = [
    "dep:rkyv",
    "officekit-markup-base/binary-format",
    "officekit-xml/binary-format",
]

[dependencies]
officekit-markup-base.workspace = true
officekit-xml.workspace = true
rkyv = { workspace = true, optional = true }
