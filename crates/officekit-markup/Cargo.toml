[package]
name = "officekit-markup"
description = "The typed tree of officekit: one module per Office Open XML namespace, with readers, writers and hooks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
include = ["/src/**/*.rs", "/LICENSE", "/LICENSE-OPEN-XML-SDK"]

[lints]
workspace = true

[features]
# rkyv and the archive of every type: officekit's binary form.
binary-format = [
    "dep:rkyv",
    "officekit-markup-base/binary-format",
    "officekit-markup-core/binary-format",
    "officekit-xml/binary-format",
]

[dependencies]
officekit-markup-base.workspace = true
officekit-markup-core.workspace = true
officekit-xml.workspace = true
rkyv = { workspace = true, optional = true }

# Without binary-format: rustdoc of rkyv's derives on every type needs more memory than docs.rs gives.
[package.metadata.docs.rs]
features = []
