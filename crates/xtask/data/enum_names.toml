# The name of every enum of the typed tree (D14), written by officekit's
# authors. An enum stands for the set of tags a choice position allows, and
# every position that allows the same set shares it (D34). The generator
# computes the sets from the Transitional schemas and SDK 3.5.1's schema data
# and finds each one's row by its module and the types whose children it is;
# it stops when a set has no row or a row matches no set.
#
# `types` names each schema type whose children the enum is, as the blueprint's
# table writes it: a type of another namespace than the enum's module carries
# its prefix. `source` says where the choice is written.
#
# The 195 choice enums of the blueprint's table come first, then the four of
# the xsd:all types (each read as a list with every tag allowed once), then
# the four of the wildcard positions (xsd:any), whose sets are the global
# elements their namespace constraint allows.

