# Types and attributes of SDK 3.5.1's data that contradict ECMA-376 and the
# files Office writes, each replaced by what ECMA-376 and Office give. The
# generator stops when a row names a type, a child or an attribute the data
# does not have.

# The data types the `c:ext` of a chart's extension list as the content of the
# one extension it knows, c16r3:dataDisplayOptions16, with no `uri` and only
# from Office 2019. ECMA-376 types it CT_Extension (dml-chart.xsd, CT_Chart).
[[extension]]
list = "c:CT_ChartExtensionList/c:extLst"
replaces = "c16r3:CT_DataDisplayOptions16/c:ext"
type = "c:CT_ChartExtension/c:ext"
attributes_of = "c:CT_ChartSpaceExtension/c:ext"
children = ["c16r3:CT_DataDisplayOptions16/c16r3:dataDisplayOptions16"]

# The data qualifies the `val` of c16r3:dispNaAsBlank with its namespace;
# Word writes it unprefixed, as every other boolean element of the chart
# extensions does.
[[attribute]]
type = "c16r3:CT_BooleanFalse/c16r3:dispNaAsBlank"
replaces = "c16r3:val"
qname = ":val"

# 1. ECMA-376 types lvlJc as CT_Jc (wml.xsd, CT_Lvl), whose val is ST_Jc: the
# twelve values from start to thaiDistribute. The data gives it its own type
# of left, center and right, w:ST_LevelJustification.
[[attribute_type]]
type = "w:CT_LevelJustification/w:lvlJc"
attribute = "w:val"
enumeration = "w:ST_Jc"

# 2. A table's jc is CT_JcTable in ECMA-376, whose val is ST_JcTable: center,
# end, left, right and start. The data's w:ST_TblJc has the first, third and
# fourth.
[[enumeration_values]]
enumeration = "w:ST_TblJc"
add = ["start", "end"]

# 3. bidiVisual is CT_OnOff in ECMA-376 (CT_TblPrBase), whose val is ST_OnOff.
# The data derives it from CT_OnOffOnly, whose val is only on or off; every
# w:CT_OnOff element, w:b among them, reads its val as ST_OnOff.
[[base_type]]
type = "w:CT_OnOffOnly/w:bidiVisual"
like = "w:CT_OnOff/w:b"

# 3b. The data derives these elements from CT_OnOffOnly as well. ECMA-376
# types each one CT_OnOff (wml.xsd: CT_TrPrBase, CT_TcPrBase, CT_Frame,
# CT_FramesetSplitbar, CT_Style), whose val is ST_OnOff.
[[base_type]]
type = "w:CT_OnOffOnly/w:cantSplit"
like = "w:CT_OnOff/w:b"

[[base_type]]
type = "w:CT_OnOffOnly/w:tblHeader"
like = "w:CT_OnOff/w:b"

[[base_type]]
type = "w:CT_OnOffOnly/w:hidden"
like = "w:CT_OnOff/w:b"

[[base_type]]
type = "w:CT_OnOffOnly/w:noWrap"
like = "w:CT_OnOff/w:b"

[[base_type]]
type = "w:CT_OnOffOnly/w:tcFitText"
like = "w:CT_OnOff/w:b"

[[base_type]]
type = "w:CT_OnOffOnly/w:hideMark"
like = "w:CT_OnOff/w:b"

[[base_type]]
type = "w:CT_OnOffOnly/w:noResizeAllowed"
like = "w:CT_OnOff/w:b"

[[base_type]]
type = "w:CT_OnOffOnly/w:linkedToFile"
like = "w:CT_OnOff/w:b"

[[base_type]]
type = "w:CT_OnOffOnly/w:noBorder"
like = "w:CT_OnOff/w:b"

[[base_type]]
type = "w:CT_OnOffOnly/w:flatBorders"
like = "w:CT_OnOff/w:b"

[[base_type]]
type = "w:CT_OnOffOnly/w:autoRedefine"
like = "w:CT_OnOff/w:b"

[[base_type]]
type = "w:CT_OnOffOnly/w:semiHidden"
like = "w:CT_OnOff/w:b"

[[base_type]]
type = "w:CT_OnOffOnly/w:unhideWhenUsed"
like = "w:CT_OnOff/w:b"

[[base_type]]
type = "w:CT_OnOffOnly/w:qFormat"
like = "w:CT_OnOff/w:b"

[[base_type]]
type = "w:CT_OnOffOnly/w:locked"
like = "w:CT_OnOff/w:b"

[[base_type]]
type = "w:CT_OnOffOnly/w:personal"
like = "w:CT_OnOff/w:b"

[[base_type]]
type = "w:CT_OnOffOnly/w:personalCompose"
like = "w:CT_OnOff/w:b"

[[base_type]]
type = "w:CT_OnOffOnly/w:personalReply"
like = "w:CT_OnOff/w:b"

# 4. ECMA-376 names the attribute `filled` (vml-main.xsd, AG_Fill). The data
# spells it `fill`, which no schema declares.
[[attribute]]
type = "v:CT_Background/v:background"
replaces = ":fill"
qname = ":filled"

# 5. The data leaves smart tags out. ECMA-376 declares smartTag in
# EG_ContentRunContent and EG_ContentRunContentBase (wml.xsd), where the data
# inlines the second as a choice that starts with the run-level sdt, and
# smartTagType in CT_Settings. The types are built from CT_SmartTagRun,
# CT_SmartTagPr and CT_SmartTagType; w:attr is the data's CT_XmlAttr, which
# ECMA-376 calls CT_Attr. The content of a smart tag is EG_PContent, which the
# data inlines as the last item of the customXml run's content model.
[[from_standard]]
types = [
  "w:CT_SmartTagRun/w:smartTag",
  "w:CT_SmartTagPr/w:smartTagPr",
  "w:CT_SmartTagType/w:smartTagType",
]
member = "w:CT_SmartTagRun/w:smartTag"
before = "w:CT_SdtRun/w:sdt"
content_of = "w:CT_CustomXmlRun/w:customXml"
parents = ["w:CT_Settings/w:settings"]

# 6. ECMA-376 types compatSetting's name as ST_String (CT_CompatSetting). The
# data gives it the closed list w:ST_CompatSettingName, whose newer values
# carry Office versions its own validator does not enforce.
[[attribute_type]]
type = "w:CT_CompatSetting/w:compatSetting"
attribute = "w:name"
string = true

# 7. The data leaves out two CT_OnOff smart tag settings that ECMA-376
# declares: doNotEmbedSmartTags in CT_Settings and saveSmartTagsAsXml in
# CT_WebSettings (wml.xsd). Each takes the data's type of w:b, the type every
# CT_OnOff element has, and occurs at most once.
[[element]]
type = "w:CT_OnOff/w:doNotEmbedSmartTags"
like = "w:CT_OnOff/w:b"
parents = ["w:CT_Settings/w:settings"]

[[element]]
type = "w:CT_OnOff/w:saveSmartTagsAsXml"
like = "w:CT_OnOff/w:b"
parents = ["w:CT_WebSettings/w:webSettings"]

# 8. Microsoft documents wne:txbxContent in place of w:txbxContent in Strict
# ([MS-ODRAWXML] 2.13.3.2, CT_TextboxInfo; [MS-OI29500] 2.1.1779). The data
# names only w:txbxContent in wps:txbx. wne:txbxContent takes its type.
[[alternative]]
type = "wne:CT_TxbxContent/wne:txbxContent"
like = "w:CT_TxbxContent/w:txbxContent"
parent = "wps:CT_TextboxInfo/wps:txbx"
beside = "w:CT_TxbxContent/w:txbxContent"

# 9. ECMA-376 declares divId and cnfStyle in CT_PPrBase, which types a numbering
# level's pPr and, through CT_PPrGeneral, a style's, a table style condition's
# and the document defaults' pPr (wml.xsd). The data leaves both out of its
# types for those four.
[[element]]
type = "w:CT_NonZeroDecimalNumber/w:divId"
parents = ["w:CT_PPrBase/w:pPr", "w:CT_PPrStyle/w:pPr", "w:CT_PPrBaseStyleable/w:pPr"]
standard = "w:CT_PPrBase"

[[element]]
type = "w:CT_Cnf/w:cnfStyle"
parents = ["w:CT_PPrBase/w:pPr", "w:CT_PPrStyle/w:pPr", "w:CT_PPrBaseStyleable/w:pPr"]
standard = "w:CT_PPrBase"

# 10. ECMA-376 declares the two band sizes in CT_TblPrBase, which types a
# table's, a table property change's and a table style condition's tblPr. The
# data has them only in a table style's own tblPr.
[[element]]
type = "w:CT_UnsignedDecimalNumberMax3/w:tblStyleRowBandSize"
parents = ["w:CT_TblPrBase/w:tblPr", "w:CT_TblPr/w:tblPr", "w:CT_TblPrStyleOverride/w:tblPr"]
standard = "w:CT_TblPrBase"

[[element]]
type = "w:CT_UnsignedDecimalNumberMax3/w:tblStyleColBandSize"
parents = ["w:CT_TblPrBase/w:tblPr", "w:CT_TblPr/w:tblPr", "w:CT_TblPrStyleOverride/w:tblPr"]
standard = "w:CT_TblPrBase"

# 11. ECMA-376 lets a background hold a drawing after its VML (CT_Background)
# and an object hold a movie in place of a control (CT_Object).
[[element]]
type = "w:CT_Drawing/w:drawing"
parents = ["w:CT_Background/w:background"]

[[element]]
type = "w:CT_Rel/w:movie"
parents = ["w:CT_Object/w:object"]

# 12. ECMA-376 declares label (CT_DecimalNumber) and tabIndex
# (CT_UnsignedDecimalNumber) in a form field's data (CT_FFData) and in a
# content control's properties (CT_SdtPr). The data has neither.
[[element]]
type = "w:CT_DecimalNumber/w:label"
like = "w:CT_DecimalNumber/w:id"
parents = ["w:CT_FFData/w:ffData", "w:CT_SdtPr/w:sdtPr"]

[[element]]
type = "w:CT_UnsignedDecimalNumber/w:tabIndex"
like = "w:CT_UnsignedDecimalNumber/w:column"
parents = ["w:CT_FFData/w:ffData", "w:CT_SdtPr/w:sdtPr"]

# 13. ECMA-376 declares title (CT_String) in a frame and a frameset, and
# longDesc (CT_Rel) in a frame (CT_Frame, CT_Frameset). The data has neither.
[[element]]
type = "w:CT_String/w:title"
like = "w:CT_String/w:tag"
parents = ["w:CT_Frame/w:frame", "w:CT_Frameset/w:frameset"]

[[element]]
type = "w:CT_Rel/w:longDesc"
like = "w:CT_Rel/w:sourceFileName"
parents = ["w:CT_Frame/w:frame"]

# 14. ECMA-376 types the value of divId and of the two band sizes
# CT_DecimalNumber, whose val is any integer (CT_PPrBase, CT_TblPrBase). The
# data gives divId a minimum of 1 and the band sizes the range 0 to 3.
[[base_type]]
type = "w:CT_NonZeroDecimalNumber/w:divId"
like = "w:CT_DecimalNumber/w:outlineLvl"

[[base_type]]
type = "w:CT_UnsignedDecimalNumberMax3/w:tblStyleRowBandSize"
like = "w:CT_DecimalNumber/w:outlineLvl"

[[base_type]]
type = "w:CT_UnsignedDecimalNumberMax3/w:tblStyleColBandSize"
like = "w:CT_DecimalNumber/w:outlineLvl"

# 15. ECMA-376 types the pPr of a style, a table style condition, the document
# defaults and a numbering level CT_PPrGeneral: CT_PPrBase and pPrChange
# (wml.xsd). The data leaves pStyle out of the first three and pPrChange out of
# the last two.
[[element]]
type = "w:CT_String/w:pStyle"
parents = ["w:CT_PPrStyle/w:pPr", "w:CT_PPrBaseStyleable/w:pPr"]
standard = "w:CT_PPrBase"

[[element]]
type = "w:CT_PPrChange/w:pPrChange"
parents = ["w:CT_PPrBase/w:pPr", "w:CT_PPrBaseStyleable/w:pPr"]
standard = "w:CT_PPrGeneral"

# 16. ECMA-376 types the tblPr of a table style and of a table style condition
# CT_TblPrBase (wml.xsd, CT_Style and CT_TblStylePr). The data's types for them
# hold only the band sizes, jc, tblCellSpacing, tblInd, tblBorders, shd and
# tblCellMar. Each row takes the type the data gives the element in a table's
# tblPr, in CT_TblPrBase's order.
[[element]]
type = "w:CT_String253/w:tblStyle"
parents = ["w:CT_TblPrStyle/w:tblPr", "w:CT_TblPrStyleOverride/w:tblPr"]
standard = "w:CT_TblPrBase"

[[element]]
type = "w:CT_TblPPr/w:tblpPr"
parents = ["w:CT_TblPrStyle/w:tblPr", "w:CT_TblPrStyleOverride/w:tblPr"]
standard = "w:CT_TblPrBase"

[[element]]
type = "w:CT_TblOverlap/w:tblOverlap"
parents = ["w:CT_TblPrStyle/w:tblPr", "w:CT_TblPrStyleOverride/w:tblPr"]
standard = "w:CT_TblPrBase"

[[element]]
type = "w:CT_OnOffOnly/w:bidiVisual"
parents = ["w:CT_TblPrStyle/w:tblPr", "w:CT_TblPrStyleOverride/w:tblPr"]
standard = "w:CT_TblPrBase"

[[element]]
type = "w:CT_TblWidth/w:tblW"
parents = ["w:CT_TblPrStyle/w:tblPr", "w:CT_TblPrStyleOverride/w:tblPr"]
standard = "w:CT_TblPrBase"

[[element]]
type = "w:CT_TblLayoutType/w:tblLayout"
parents = ["w:CT_TblPrStyle/w:tblPr", "w:CT_TblPrStyleOverride/w:tblPr"]
standard = "w:CT_TblPrBase"

[[element]]
type = "w:CT_TblLook/w:tblLook"
parents = ["w:CT_TblPrStyle/w:tblPr", "w:CT_TblPrStyleOverride/w:tblPr"]
standard = "w:CT_TblPrBase"

[[element]]
type = "w:CT_String/w:tblCaption"
parents = ["w:CT_TblPrStyle/w:tblPr", "w:CT_TblPrStyleOverride/w:tblPr"]
standard = "w:CT_TblPrBase"

[[element]]
type = "w:CT_String/w:tblDescription"
parents = ["w:CT_TblPrStyle/w:tblPr", "w:CT_TblPrStyleOverride/w:tblPr"]
standard = "w:CT_TblPrBase"
