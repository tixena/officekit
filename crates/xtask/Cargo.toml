[package]
name = "xtask"
description = "Internal developer tooling for the officekit workspace"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
# Subcommand dispatch.
clap.workspace = true

# Error handling.
anyhow.workspace = true

# The only route to the OS: inputs are found through `System`.
os-shim.workspace = true

# The SDK's schema data is JSON.
serde_json.workspace = true

# Reads the XSD files the schema model is built from.
quick-xml.workspace = true

# Reads the hand-maintained tables of simple types and part roots.
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }
