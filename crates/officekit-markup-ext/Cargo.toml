[package]
name = "officekit-markup-ext"
description = "The typed tree's other namespaces, its root hooks, and every namespace's hooks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# The crate has no tests; a unit-test or bench target would compile the whole
# crate a second time, beside the library.
test = false
doctest = false
bench = false

[lints]
workspace = true

[features]
# rkyv and the archive of every type: officekit's binary form.
binary-format = [
    "dep:rkyv",
    "officekit-markup-base/binary-format",
    "officekit-markup-core/binary-format",
    "officekit-xml/binary-format",
]

[dependencies]
officekit-markup-base.workspace = true
officekit-markup-core.workspace = true
officekit-xml.workspace = true
rkyv = { workspace = true, optional = true }

# Without binary-format: rustdoc of rkyv's derives on every type needs more memory than docs.rs gives.
[package.metadata.docs.rs]
features = []
