[package]
name = "officekit-core"
description = "Core library for officekit: Open Packaging Conventions and the Office Open XML document model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = ["transitional"]
transitional = []
strict = []

[dependencies]
# System abstraction (filesystem, env, temp dirs)
os-shim.workspace = true

# Zip container underneath every OPC package
zip.workspace = true

# Reads and writes the XML of every part
quick-xml.workspace = true

# Error handling
thiserror.workspace = true

[dev-dependencies]
# The round-trip example takes its folder from the command line
clap.workspace = true

# The round-trip example unzips each sample file into a MemorySystem
os-shim = { workspace = true, features = ["zip"] }
