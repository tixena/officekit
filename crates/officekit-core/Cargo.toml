[package]
name = "officekit-core"
description = "Core library for officekit: Open Packaging Conventions and the Office Open XML document model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[[example]]
name = "office_checks"
required-features = ["strict", "transitional"]

[features]
default = ["transitional"]
transitional = ["officekit-parts/transitional", "dep:officekit-transitional"]
strict = ["officekit-parts/strict", "dep:officekit-strict", "dep:officekit-traversal"]
markdown = ["transitional", "dep:archie-core", "dep:image-webp", "dep:png", "dep:resvg"]

[dependencies]
# The XML layer: element tree, names, values, markup compatibility, part reader and writer
officekit-xml.workspace = true

# The typed tree: one module per namespace, with readers, writers and hooks
officekit-markup.workspace = true

# The traversals of the typed tree: the Strict read of a workbook transforms it
officekit-traversal = { workspace = true, optional = true }

# The package layer: the container, part names, content types, relationships, image parts
officekit-packaging.workspace = true

# The part modules: each part type's content type, relationship type, load and store
officekit-parts = { workspace = true, default-features = false }

# The validation tables the merge of runs reads
officekit-validation.workspace = true

# The Transitional class: every node's read and write, and the conversion of date cells
officekit-transitional = { workspace = true, optional = true }

# The Strict class: every node's read and write
officekit-strict = { workspace = true, optional = true }

# System abstraction (filesystem, env, temp dirs); its zip feature moves a
# package between an archive and an in-memory filesystem
os-shim = { workspace = true, features = ["zip"] }

# Error handling
thiserror.workspace = true

# officekit's binary form: the model of a whole package archived and read back
rkyv = { workspace = true, features = ["alloc", "bytecheck"] }

# A folder's manifest is JSON
serde_json.workspace = true

# Hashes a document-protection password, and writes the hash and salt as text
sha1.workspace = true
base64 = { workspace = true, features = ["alloc"] }

# Cleans a folder name
regex = { workspace = true, features = ["std"] }

# Markdown documents as a typed tree
archie-core = { workspace = true, optional = true }

# Pictures: an SVG rendered to the PNG Word keeps beside it, a WebP decoded to PNG
image-webp = { workspace = true, optional = true }
png = { workspace = true, optional = true }
resvg = { workspace = true, optional = true, features = ["raster-images"] }

[dev-dependencies]
# The write-through tests and the timing example walk the typed tree
officekit-traversal.workspace = true

# The round-trip example takes its folder from the command line
clap = { workspace = true, features = ["std", "derive"] }

# The round-trip example reads parts event by event
quick-xml.workspace = true

# Tests build archives whose entries carry data descriptors
zip.workspace = true
