[package]
name = "officekit-core"
description = "Core library for officekit: Open Packaging Conventions and the Office Open XML document model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[[example]]
name = "office_checks"
required-features = ["strict", "transitional"]

[features]
default = ["transitional"]
transitional = []
strict = []

[dependencies]
# The XML layer: element tree, names, values, markup compatibility, part reader and writer
officekit-xml.workspace = true

# System abstraction (filesystem, env, temp dirs); its zip feature moves a
# package between an archive and an in-memory filesystem
os-shim = { workspace = true, features = ["zip"] }

# Reads and writes the XML of every part
quick-xml.workspace = true

# Error handling
thiserror.workspace = true

# The validator's JSON records
serde_json.workspace = true

# Reads an image's pixel size from its header; no pixel decoding
imagesize = { version = "0.15", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff"] }

# Hashes a document-protection password, and writes the hash and salt as text
sha1 = "0.10"
base64 = "0.22"

# Runs the pattern facets of the validation tables, matched whole.
regex = "1"

[dev-dependencies]
# The round-trip example takes its folder from the command line
clap.workspace = true

# Tests build archives whose entries carry data descriptors
zip.workspace = true
