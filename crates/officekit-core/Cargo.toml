[package]
name = "officekit-core"
description = "Core library for officekit: Open Packaging Conventions and the Office Open XML document model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = ["transitional"]
transitional = []
strict = []

[dependencies]
# System abstraction (filesystem, env, temp dirs); its zip feature moves a
# package between an archive and an in-memory filesystem
os-shim = { workspace = true, features = ["zip"] }

# Reads and writes the XML of every part
quick-xml.workspace = true

# Error handling
thiserror.workspace = true

# The validator's JSON records
serde_json.workspace = true

# Runs the pattern facets of the validation tables, matched whole.
regex = "1"

[dev-dependencies]
# The round-trip example takes its folder from the command line
clap.workspace = true

# Tests build archives whose entries carry data descriptors
zip.workspace = true
