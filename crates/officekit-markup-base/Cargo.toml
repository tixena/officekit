[package]
name = "officekit-markup-base"
description = "The typed tree's runtime, and the namespaces the typed tree's cycle depends on"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
include = ["/src/**/*.rs", "/LICENSE", "/LICENSE-OPEN-XML-SDK"]

[lints]
workspace = true

[features]
# rkyv and the archive of every type: officekit's binary form.
binary-format = ["dep:rkyv", "officekit-xml/binary-format"]

[dependencies]
officekit-xml.workspace = true
rkyv = { workspace = true, optional = true }

[package.metadata.docs.rs]
all-features = true
