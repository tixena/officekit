[package]
name = "officekit"
description = "Office Open XML documents, .docx, .xlsx and .pptx, in either conformance class: their part modules, read, edit, write and validation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
include = ["/src/**/*.rs", "/LICENSE", "/LICENSE-OPEN-XML-SDK"]

[lints]
workspace = true

[[example]]
name = "office_checks"
required-features = ["strict", "transitional"]

[features]
default = ["transitional"]
# The `transitional` module: the Transitional class, every node's read and write, and the
# conversion of date cells.
transitional = []
strict = ["dep:officekit-strict"]
# The `binary` module: officekit's binary form, an rkyv archive of a file's model.
binary-format = ["dep:rkyv", "officekit-markup/binary-format", "officekit-xml/binary-format"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
# The XML and package layer: element tree, names, values, part reader and writer, and the
# container with its part names, content types, relationships and image parts
officekit-xml.workspace = true

# The typed tree: one module per namespace, with readers, writers and hooks
officekit-markup.workspace = true

# The Strict class, every node's read and write, and the traversals the Strict read of a
# workbook transforms it with
officekit-strict = { workspace = true, optional = true }

# System abstraction (filesystem, env, temp dirs); its zip feature moves a
# package between an archive and an in-memory filesystem
os-shim = { workspace = true, features = ["zip"] }

# Error handling
thiserror.workspace = true

# officekit's binary form: the model of a whole package archived and read back
rkyv = { workspace = true, optional = true, features = ["alloc", "bytecheck"] }

# A folder's manifest and the validator's records are JSON
serde_json = { workspace = true, features = ["alloc", "default", "std", "unbounded_depth"] }

# Hashes a document-protection password, and writes the hash and salt as text
sha1.workspace = true
base64 = { workspace = true, features = ["alloc"] }

# Cleans a folder name, and runs the pattern facets of the validation tables, matched whole
regex = { workspace = true, features = ["std", "unicode-gencat"] }

[dev-dependencies]
# The write-through tests and the timing example walk the typed tree
officekit-strict.workspace = true

# The examples that stream a package into a file write to os-shim's async stream
futures-io.workspace = true

# The round-trip example takes its folder from the command line
clap = { workspace = true, features = ["std", "derive"] }

# The round-trip example reads parts event by event
quick-xml.workspace = true

# Tests build archives whose entries carry data descriptors
zip.workspace = true
